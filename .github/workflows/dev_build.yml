name: Build
on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            21
            25

      - name: Build with Gradle
        run: ./gradlew build

      - name: Build earth-science addon
        working-directory: earth-science
        run: ./gradlew build

      - name: Build liquid-glass addon
        working-directory: liquid-glass
        run: ./gradlew build

      - name: Build columns addon
        working-directory: columns
        run: ./gradlew build

      - name: Build glass-columns addon
        working-directory: glass-columns
        run: ./gradlew build

      - name: Build aurora-glass addon
        working-directory: aurora-glass
        run: ./gradlew build

      - name: Build aurora-columns addon
        working-directory: aurora-columns
        run: ./gradlew build

      - name: Build the Minecraft 1.21.11 ports
        run: |
          for project in cyber earth-science liquid-glass columns glass-columns aurora-glass aurora-columns; do
            (cd "mc-1.21.11/$project" && ./gradlew build)
          done
